name: CI

on:
  push:
    branches: [dev, pub]
  pull_request:
    branches: [dev, pub]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: cp .env.example .env && php artisan key:generate --force

      - name: Run tests
        run: php artisan test --compact

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  mobile:
    name: Mobile typecheck and export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Export web bundle
        run: npm run export:web

  compose:
    name: Compose integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --profile tools config --quiet

      - name: Build application images
        run: docker compose build backend web

      - name: Start the full stack
        run: docker compose up -d

      - name: Show service status
        run: docker compose ps

      - name: Smoke test API and web
        run: |
          curl --fail --retry 10 --retry-delay 3 http://localhost:8080
          curl --fail --retry 10 --retry-delay 3 --header 'Accept: application/json' http://localhost:8001/up
          docker compose exec -T backend php artisan about --only=environment

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 backend web

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
